<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Álbum de Emprendedores Locales – Chincha Baja</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2b4a;--yellow:#ffd84d;--pink:#ffc3d8;--red:#e8504a;--paper:#fffdf6;--tint:#cfe6fa}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:12px 12px 8px;gap:8px;overflow:hidden;
background-color:var(--tint);transition:background-color .7s;
background-image:radial-gradient(circle,#ffffffaa 2px,transparent 2.5px),radial-gradient(ellipse at 50% 40%,#ffffff99,transparent 65%);background-size:26px 26px,100% 100%}
header{text-align:center;z-index:1}
h1{margin:0;font-size:clamp(1.15rem,2.6vw,1.7rem);font-weight:800;line-height:1.1}
h1 span{background:linear-gradient(transparent 55%,var(--yellow) 55%);padding:0 .25em}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,28px);z-index:1;perspective:1600px}
.frame{position:relative;isolation:isolate;max-height:100%;padding:8px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);display:flex;min-height:0}
.frame::before,.frame::after{content:"";position:absolute;inset:0;border:3px solid var(--ink);border-radius:22px;background:var(--paper);z-index:-1}
.frame::before{transform:rotate(-3deg) translate(-8px,4px)}
.frame::after{transform:rotate(2.5deg) translate(9px,2px);background:var(--pink)}
.page{max-height:100%;max-width:calc(100vw - 150px);border-radius:14px;object-fit:contain;touch-action:pan-y;transform-origin:left center}
.page.next{animation:fn .5s cubic-bezier(.2,.7,.3,1)}
.page.back{transform-origin:right center;animation:fb .5s cubic-bezier(.2,.7,.3,1)}
@keyframes fn{from{transform:rotateY(-75deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fb{from{transform:rotateY(75deg);opacity:0}to{transform:none;opacity:1}}
.nav{width:54px;height:54px;flex:none;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);color:var(--ink);font:800 1.7rem/1 'Baloo 2',sans-serif;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.nav:hover:not(:disabled){background:#ffe373}
.nav:active:not(:disabled){transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.nav:disabled{opacity:.35;cursor:default;box-shadow:none}
.nav:focus-visible,.thumb:focus-visible,.open:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.bar{display:flex;align-items:center;gap:10px;z-index:1;width:min(520px,90vw)}
.count{font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 .9em;font-size:.9rem;white-space:nowrap}
.prog{flex:1;height:12px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width .4s}
.thumbs{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:8px 10px 10px;z-index:1}
.thumb{flex:none;width:42px;height:56px;border:2px solid var(--ink);border-radius:9px;padding:0;background:#fff;cursor:pointer;overflow:hidden;opacity:.7;transition:transform .15s}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb[aria-current=true]{opacity:1;transform:translateY(-6px) rotate(-3deg);box-shadow:3px 3px 0 var(--ink)}
.deco{position:fixed;bottom:0;pointer-events:none;z-index:0}
.deco.l{left:10px}.deco.r{right:10px}
.cover{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;
background-color:#cfe6fa;background-image:radial-gradient(circle,#ffffffaa 2px,transparent 2.5px);background-size:26px 26px;transition:transform .8s cubic-bezier(.7,0,.3,1)}
.cover.gone{transform:translateY(-105%)}
.cover h2{margin:0;font-size:clamp(2rem,7vw,4.2rem);font-weight:800;line-height:1}
.cover h2 span{background:linear-gradient(transparent 55%,var(--yellow) 55%);padding:0 .2em}
.cover p{margin:0;font-size:clamp(1rem,2.4vw,1.4rem)}
.tag{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:0 1em;font-weight:800;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}
.open{margin-top:8px;border:3px solid var(--ink);border-radius:99px;background:var(--yellow);color:var(--ink);font:800 1.3rem 'Baloo 2',sans-serif;padding:.2em 1.5em;cursor:pointer;box-shadow:5px 5px 0 var(--ink);animation:pulse 1.8s infinite}
.open:active{transform:translate(5px,5px);box-shadow:none}
@keyframes pulse{50%{transform:scale(1.05)}}
@media(max-width:760px){.deco{display:none}.page{max-width:calc(100vw - 100px)}.nav{width:38px;height:38px;font-size:1.2rem;box-shadow:3px 3px 0 var(--ink)}.frame{box-shadow:5px 5px 0 var(--ink)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tools{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:5}
.tool{width:42px;height:42px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-size:1.2rem;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.tool:active{transform:translate(3px,3px);box-shadow:none}
.tool:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.page{cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:30;background:#1d2b4acc;overflow:auto;display:none;padding:20px;cursor:zoom-out}
.zoom.on{display:block}
.zoom img{display:block;margin:0 auto;width:min(100%,760px);border-radius:16px;border:3px solid var(--ink);background:#fff}
.zoom span{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--yellow);border:3px solid var(--ink);border-radius:99px;padding:0 1em;font-weight:700}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
.float{position:absolute;font-size:clamp(1.8rem,5vw,3.2rem);animation:bob 4s ease-in-out infinite;filter:drop-shadow(3px 3px 0 #1d2b4a33)}
@keyframes bob{50%{transform:translateY(-16px) rotate(8deg)}}
@media(max-width:760px){.tools{top:8px;right:8px}}

.float{background:none;border:0;padding:6px;cursor:grab;touch-action:none;user-select:none}
.float.drag{animation:none;cursor:grabbing;z-index:3;transform:scale(1.2) rotate(-6deg)}
.float.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.5) rotate(12deg)}}
.float:focus-visible{outline:3px solid var(--red);border-radius:12px}
.bit{position:fixed;pointer-events:none;font-size:1.3rem;z-index:12;transition:transform .7s cubic-bezier(.1,.8,.3,1),opacity .7s}
.coins{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:0 1em;font-weight:800;box-shadow:4px 4px 0 var(--ink);font-size:.95rem}
.cover.lit{background-color:#fff0a6}
.cover.lit .tag{background:var(--yellow)}
.cover{transition:transform .8s cubic-bezier(.7,0,.3,1),background-color .5s}
</style>
</head>
<body>
<svg class="deco l" width="150" height="150" viewBox="0 0 150 150" aria-hidden="true"><g stroke="#1d2b4a" stroke-width="3" stroke-linejoin="round"><rect x="20" y="60" width="90" height="80" fill="#fffdf6"/><path d="M12 60h106l-10-30H22z" fill="#e8504a"/><path d="M42 30l-6 30M64 30l-2 30M86 30l2 30M106 30l4 30" stroke="#fff"/><rect x="34" y="82" width="34" height="36" fill="#cfe6fa"/><rect x="78" y="90" width="20" height="50" fill="#ffd84d"/></g></svg>
<svg class="deco r" width="170" height="150" viewBox="0 0 170 150" aria-hidden="true"><g stroke="#1d2b4a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="20" y="95" width="22" height="45" fill="#cfe6fa"/><rect x="52" y="75" width="22" height="65" fill="#cfe6fa"/><rect x="84" y="50" width="22" height="90" fill="#cfe6fa"/><ellipse cx="140" cy="132" rx="20" ry="8" fill="#ffd84d"/><ellipse cx="140" cy="118" rx="20" ry="8" fill="#ffd84d"/><ellipse cx="140" cy="104" rx="20" ry="8" fill="#ffd84d"/><path d="M14 70l50-28 40-6M92 28l14 8-6 14" fill="none" stroke="#3a9d5d"/></g></svg>

<div class="cover" id="cover">
  <button class="float" data-k="cake" style="left:8%;top:14%" aria-label="Pastelito">🧁</button><button class="float" data-k="cart" style="right:9%;top:18%;animation-delay:-1s" aria-label="Carrito">🛒</button><button class="float" data-k="food" style="left:12%;bottom:16%;animation-delay:-2s" aria-label="Plato">🍽️</button><button class="float" data-k="coin" style="right:12%;bottom:18%;animation-delay:-3s" aria-label="Moneda"><svg width="1em" height="1em" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#ffd84d" stroke="#1d2b4a" stroke-width="3"/><circle cx="20" cy="20" r="11" fill="none" stroke="#1d2b4a" stroke-width="2" opacity=".5"/><text x="20" y="25" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="13" fill="#1d2b4a">S/</text></svg></button><button class="float" data-k="idea" style="left:50%;top:6%;animation-delay:-1.5s" aria-label="Idea">💡</button>
  <span class="coins" id="coins" aria-live="polite">💰 0 · ¡toca los objetos!</span>
  <span class="tag">Chincha Baja</span>
  <h2><span>Álbum de</span><br><span>Emprendedores</span><br><span>Locales</span></h2>
  <p>Pequeños negocios, grandes aportes</p>
  <button class="open" id="open">Abrir álbum</button>
</div>

<div class="tools"><button class="tool" id="fs" aria-label="Pantalla completa">⛶</button></div>
<div class="zoom" id="zoom"><span>Toca para cerrar</span><img id="zimg" alt=""></div>
<canvas id="fx"></canvas>
<header><h1><span>Álbum de Emprendedores Locales</span></h1></header>
<div class="stage">
  <button class="nav" id="prev" aria-label="Página anterior">‹</button>
  <div class="frame"><img class="page" id="page" alt=""></div>
  <button class="nav" id="next" aria-label="Página siguiente">›</button>
</div>
<div class="bar"><span class="count" id="count"></span><div class="prog"><i id="prog"></i></div></div>
<div class="thumbs" id="thumbs"></div>

<script>
const pages=[
["01_portada.png","Portada","#cfe6fa"],["02_introduccion.png","Introducción","#fff0b3"],["03_tortas_pili.png","Tortas Pili","#ffd3e2"],
["04_hass_restaurante.png","Hass Restaurante","#c6ecd0"],["05_tortas_bocaditos_dozlem.png","Tortas y Bocaditos D'Ozlem","#e0d4f7"],
["06_pasteleria_dulce_morena.png","Pastelería Dulce Morena","#ffdcb8"],["07_minimarket_andrea.png","Minimarket Andrea","#bfe3f7"],
["08_impacto_tlc.png","Impacto del TLC","#ddd2f5"],["09_importancia.png","Importancia de los emprendedores","#ffe9a8"],["10_conclusion.png","Conclusión","#cfe6fa"]];
let i=-1;const $=id=>document.getElementById(id),img=$('page'),th=$('thumbs');
pages.forEach(([f,t],n)=>{const b=document.createElement('button');b.className='thumb';b.setAttribute('aria-label',t);
b.innerHTML='<img src="images/'+f+'" alt="">';b.onclick=()=>go(n);th.appendChild(b)});
function go(n){if(n<0||n>=pages.length)return;const fwd=n>=i;i=n;
img.src='images/'+pages[n][0];img.alt=pages[n][1];img.className='page';void img.offsetWidth;img.classList.add(fwd?'next':'back');
document.documentElement.style.setProperty('--tint',pages[n][2]);document.body.style.setProperty('--tint',pages[n][2]);
$('count').textContent=(n+1)+' / '+pages.length+' · '+pages[n][1];$('prog').style.width=((n+1)/pages.length*100)+'%';
$('prev').disabled=n===0;$('next').disabled=n===pages.length-1;
[...th.children].forEach((b,k)=>b.setAttribute('aria-current',k===n));
th.children[n].scrollIntoView({inline:'center',block:'nearest'});history.replaceState(null,'','#'+(n+1))}
$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(i-1);if(e.key==='ArrowRight')go(i+1)});
let x0=null;img.addEventListener('touchstart',e=>x0=e.touches[0].clientX);
img.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)go(i+(d<0?1:-1));x0=null});
const hadHash=!!location.hash;const start=parseInt(location.hash.slice(1))||1;go(Math.max(0,Math.min(pages.length-1,start-1)));
const cover=$('cover');
function openAlbum(){cover.classList.add('gone');setTimeout(()=>cover.style.display='none',900)}
$('open').onclick=openAlbum;if(hadHash)cover.style.display='none';

/* extras */
pages.forEach(p=>{const im=new Image();im.src='images/'+p[0]});
img.onclick=()=>{$('zimg').src=img.src;$('zimg').alt=img.alt;$('zoom').classList.add('on')};
$('zoom').onclick=()=>$('zoom').classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape')$('zoom').classList.remove('on')});
$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
const cv=$('fx'),cx=cv.getContext('2d');let ps=[],raf;
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;cv.width=innerWidth;cv.height=innerHeight;
const cols=['#ffd84d','#e8504a','#ffc3d8','#3a9d5d','#4a90d9','#fff'];
ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:6+Math.random()*7,r:Math.random()*6,c:cols[Math.random()*cols.length|0]}));
cancelAnimationFrame(raf);(function t(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
ps=ps.filter(p=>p.y<cv.height+20);if(ps.length)raf=requestAnimationFrame(t);else cx.clearRect(0,0,cv.width,cv.height)})()}
const _go=go;go=function(n){const prev=i;_go(n);if(n===pages.length-1&&prev===pages.length-2)confetti()};

/* objetos interactivos de la portada */
let coins=0;const FX={cake:['✨','🍓','🍒'],cart:['🛍️','📦','⭐'],food:['🍟','🥑','🍅'],coin:['💰','✨','💰'],idea:['✨','⭐','💫']};
function burst(el,k){const r=el.getBoundingClientRect(),cx0=r.left+r.width/2,cy0=r.top+r.height/2;
for(let n=0;n<8;n++){const b=document.createElement('span');b.className='bit';b.textContent=FX[k][n%3];b.style.left=cx0+'px';b.style.top=cy0+'px';document.body.appendChild(b);
const a=n/8*6.28,d=60+Math.random()*50;requestAnimationFrame(()=>{b.style.transform='translate('+Math.cos(a)*d+'px,'+Math.sin(a)*d+'px) rotate('+(Math.random()*360)+'deg)';b.style.opacity=0});setTimeout(()=>b.remove(),750)}}
function hit(el){const k=el.dataset.k;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');burst(el,k);
if(k==='coin'){coins++;$('coins').textContent=coins>=10?'🎉 ¡Eres un gran emprendedor!':'💰 '+coins+' moneda'+(coins>1?'s':'')+(coins>=5?' · ¡sigue!':'');if(coins===10)confetti()}
if(k==='idea')cover.classList.toggle('lit')}
document.querySelectorAll('.float').forEach(el=>{let sx,sy,ox,oy,moved=false,on=false;
el.addEventListener('pointerdown',e=>{on=true;moved=false;sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();ox=r.left;oy=r.top;el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)>6){moved=true;el.classList.add('drag');el.style.right=el.style.bottom='auto'}
if(moved){el.style.left=(ox+dx)+'px';el.style.top=(oy+dy)+'px'}});
el.addEventListener('pointerup',()=>{on=false;el.classList.remove('drag');if(!moved)hit(el)});
el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(el)}})});
</script>
</body>
</html>
